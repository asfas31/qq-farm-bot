syntax = "proto3";

option go_package = "farm-capture/internal/game/pb";

package gamepb.friendpb;

message Plant {
    int64 dry_time_sec = 1;
    int64 weed_time_sec = 2;
    int64 insect_time_sec = 3;
    int64 ripe_time_sec = 4;
    int64 ripe_fruit_id = 5;
    int64 steal_plant_num = 6;
    int64 dry_num = 7;
    int64 weed_num = 8;
    int64 insect_num = 9;
}

message Tags {
    bool is_new = 1;
    bool is_follow = 2;
}

message GameFriend {
    int64 gid = 1;
    string open_id = 2;
    string name = 3;
    string avatar_url = 4;
    string remark = 5;
    int64 level = 6;
    int64 gold = 7;
    Tags tags = 8;
    Plant plant = 9;
    int32 authorized_status = 10;
}

message GetAllReply {
    repeated GameFriend game_friends = 1;
    int64 application_count = 3;
}

message SyncAllReply {
    repeated GameFriend game_friends = 1;
    int64 application_count = 3;
}

message FriendAddedNotify {
    repeated GameFriend friends = 1;
}
